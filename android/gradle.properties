org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# ---- Dunia app settings (override with -P on the command line or in CI) ----
# The HTTPS address where your Dunia server runs. The app is a native shell around it.
duniaBaseUrl=https://dunia.example.com
# Play Store package name. Must match PLAY_PACKAGE_NAME on the server.
duniaAppId=app.dunia.chat
duniaVersionCode=1
duniaVersionName=1.0.0
