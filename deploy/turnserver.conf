# coturn configuration for Dunia (the secret, realm and public IP come from
# docker-compose / .env on the command line).
listening-port=3478
tls-listening-port=5349
fingerprint

# Short-lived credentials derived from TURN_SECRET (the "TURN REST API").
# Must match TURN_SECRET in Dunia's .env.
use-auth-secret

# Relay port range — open these UDP ports in your firewall/security group.
min-port=49160
max-port=49999

# Keep abuse and cost in check.
total-quota=2000
user-quota=12
stale-nonce=600
no-multicast-peers
no-cli
no-tlsv1
no-tlsv1_1

# SECURITY: never relay into private networks. Without these lines a TURN
# server can be used to reach your internal services (SSRF).
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# For TURN over TLS (port 5349, helps on strict corporate networks), mount
# certificates and uncomment:
# cert=/etc/coturn/certs/fullchain.pem
# pkey=/etc/coturn/certs/privkey.pem

log-file=stdout
simple-log
